# THE ARCHITECTURE GATES, ON EVERY PUSH, WITH NO PATHS FILTER.
#
# build.yml -- which is where these gates otherwise run, as ctest tests -- triggers only on changes under
# assets/, source/, toolchains/ or triplets/. That filter is right for a six-job multi-platform compile and
# exactly wrong for every check below, because their INPUTS live in the two trees the filter excludes:
#
#   render_docs_fresh  reads docs/render/architecture-3-target-state.md    -> docs/**
#   boundary_fresh     reads docs/render/game-render-boundary.md           -> docs/**
#   arch_graph_fresh   reads docs/architecture/system-boundaries.md        -> docs/**
#   layer1_layering    is  scripts/layering-lint.py                        -> scripts/**
#   render_layering    is  the same script, different needle               -> scripts/**
#   config_declared    is  scripts/config-lint.py                          -> scripts/**
#   boundary_ratchet   is  scripts/boundary-inventory.py                   -> scripts/**
#
# So the gates were blind to commits in precisely the trees they police: a doc-only commit could not fail
# the doc-drift gate, and editing an instrument could not fail the instrument. 8781759c -- the docs/render
# index -- started no CI job at all. This workflow closes that, and it is deliberately cheap: no compiler,
# no vcpkg, no cache, a few seconds. Widening build.yml's filter instead would have fired six full
# multi-platform builds for a typo fix.
#
# NOT COVERED HERE, AND NOT A GAP: the configure-time checks in source/test/CMakeLists.txt (the NoAssets
# label rule and the CMakePresets filter assertion) are triggered by their own files, which are under
# source/ and therefore already match build.yml's filter.
name: Gates

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  gates:
    name: Architecture gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # These are the same commands source/test/CMakeLists.txt registers with ctest, run directly. Naming
      # the interpreter rather than relying on the shebang is the rule that #192 cost a red CI to learn.
      - name: layer1_layering -- the sovereign L1 module must not name OpenGlRenderer
        run: python3 scripts/layering-lint.py

      # --from-cmake, NOT a pasted copy of the ceilings. The ratchet is declared once, in the ctest
      # registration; restating the numbers here would let a lowered ceiling in CMakeLists leave a stale
      # copy quietly passing -- the one-knob-two-declarations defect #185 exists to delete.
      - name: render_layering -- the L3 Air-Gap ratchet
        run: python3 scripts/layering-lint.py --needle "Root::singleton" --from-cmake

      - name: render_docs_fresh -- generated coupling counts still match the tree
        run: python3 scripts/render-inventory.py --check docs/render/architecture-3-target-state.md

      - name: config_declared -- every getOrDefault key has a declared default
        run: python3 scripts/config-lint.py

      # The ceiling is passed here rather than restated: it lives in source/test/CMakeLists.txt, and a pasted
      # copy would let a lowered ceiling leave a stale duplicate quietly passing.
      - name: boundary_ratchet -- the game layer's push-sink surface may not grow
        run: |
          CEIL=$(grep -oE 'boundary-inventory\.py --max-sink [0-9]+' source/test/CMakeLists.txt \
                 | grep -oE '[0-9]+$')
          test -n "$CEIL" || { echo "could not read the boundary ceiling from source/test/CMakeLists.txt"; exit 1; }
          python3 scripts/boundary-inventory.py --max-sink "$CEIL"

      - name: boundary_fresh -- the boundary doc's generated numbers match the tree
        run: python3 scripts/boundary-inventory.py --check docs/render/game-render-boundary.md

      # Nine generated Mermaid diagrams, one altitude up from the render docs. Also fails on duplicate
      # header basenames and on a tier table that contradicts the grants -- the two conditions under
      # which the generator would draw something confidently wrong.
      - name: arch_graph_fresh -- the system-boundary diagrams match the tree
        run: python3 scripts/arch-graph.py --check docs/architecture/system-boundaries.md

      # The grant table is the one artifact in the headless-client design with no instrument behind
      # it, and two defects sat there -- both would have failed to compile. Transitive, because the
      # preprocessor is; plus a ratchet on the crossings the design exists to delete.
      # The grant sweep checks EDGES and spec-derivations checks FACET SHAPE. Neither reads the
      # register's artefact names, which is how the `metrics` row came to say two readers while the
      # tree held five types it did not mention. Both directions: a named type that does not exist
      # FAILS; types that exist and are unnamed are ratcheted, because a register cell summarises.
      - name: register_artefacts -- the component register's named types match the tree
        run: python3 scripts/register-artefacts.py

      - name: register_artefacts_fires -- both directions see the real tree
        run: python3 scripts/register-artefacts.py --selftest

      - name: grant_sweep -- the headless-client grant table matches the tree
        run: python3 scripts/grant-sweep.py --check

      # The design's loop count was wrong twice, both found by inspection. A count nobody can
      # recompute is a claim, not a measurement.
      - name: loop_inventory -- every cadence loop is declared and the spec agrees
        run: python3 scripts/loop-inventory.py --check

      # N1.d called itself "countable" and "gateable rather than aspirational" while Section 18
      # recorded that the ratchet had no metric and no ceiling -- two writers disagreeing about
      # whether the document's own rule was enforceable. The definition was already in the seam
      # table: a round trip is a call that RETURNS. Ceiling 1, plus the assertion a total count
      # cannot make on its own -- that no Sink answers.
      - name: round_trip_ceiling -- seam 1 declares at most one call that returns
        run: python3 scripts/round-trip.py --check
      - name: round_trip_fires -- both round-trip assertions fire on a known defect
        run: python3 scripts/round-trip.py --selftest

      # "Is every table generated from a source?" was answered three times from the command line and
      # was wrong three times. This counts tables two independent ways, requires the two to agree,
      # and reconciles the derivation tables against the register -- so the answer is reproducible
      # rather than mine. A MEASUREMENT: there is no ceiling on unread tables.
      - name: table_census -- every table counted two ways, derivations reconciled to the register
        run: python3 scripts/table-census.py --check

      # The design is described twice on purpose -- Section 4 compile, Section 5 run time -- and two
      # descriptions of one model drift. The graft rule is the reason this is a gate: every runtime
      # edge must be legal in the compile projection, and its first run found the host unable to
      # trigger the paint.
      - name: spec_consistency -- both projections agree, and the graft holds
        run: python3 scripts/spec-consistency.py --check

      # Derived from the grant table, so it needs no build and belongs here rather than only in ctest.
      - name: composition_graphs -- per-composition diagrams match the grant table
        run: python3 scripts/composition-graphs.py --check

      # Derived from the runtime projection's edges. Fails on an element that is neither driven nor
      # declared undriven -- "what starts this?" must have an answer for all 24.
      - name: drive_table -- what drives what, generated from the runtime projection
        run: python3 scripts/drive-table.py --check

      # The only gate that greps C++ for the design. Owns the tree measurements a DESIGN DECISION
      # rests on -- "thirteen render() bodies" was 17, "exactly four" Lua groups was 11.
      - name: spec_measures -- the load-bearing measurements still hold
        run: python3 scripts/spec-measures.py --check

      # Counts whether each component is DERIVED, facet by facet. Every other gate here checks that a
      # declaration is well-formed; this one checks that the declaration was ever REASONED FOR. A
      # warranted register row looks finished, which is exactly why 32 of 41 components could carry a
      # duty, a warrant and nothing else without one gate noticing.
      - name: spec_derivations -- every component reasoned for, not merely declared
        run: python3 scripts/spec-derivations.py --check

      # The only gate that reads the WORDS. The others check tables and were all green while the
      # prose said "three clocks", called `participant` `client`, and referenced undefined decisions.
      - name: prose_claims -- the prose agrees with the registers
        run: python3 scripts/prose-claims.py --check

      # A green gate says the document is clean; it says nothing about whether the gate can see. Two
      # of prose_claims' verdicts were half-blind for their entire life while reporting OK. This
      # injects one known defect per verdict and asserts each fires, plus a control that must not.
      - name: prose_claims_fires -- every verdict fires on a known defect
        run: python3 scripts/prose-claims.py --selftest

      # The gate suite is otherwise blind to comments by design -- layering-lint strips them before it
      # reads anything. This is the one comment claim a machine can settle: a file:line citation. All
      # nine that existed were ours, 55% had already rotted, and two written on one day were both wrong
      # within ten days. So the FORM goes, not the instances (#218).
      - name: comment_claims -- no source comment cites a file by line number
        run: python3 scripts/comment-claims.py

      # measures/validWhen/whole are the only same-typed fields in MetricDesc, so writing them in the
      # wrong order compiles, passes every other check, and swaps a metric's stated meaning with its
      # stated condition -- with no runtime symptom, since the strings are only printed. The header
      # claimed this lint enforced designators here for as long as the lint did not exist; it now does,
      # and its first run found the one site that sets those fields, built positionally, in the fixture
      # for this very hazard. Static: no GPU, no binary.
      - name: metric_desc_lint -- a MetricDesc prose field may not be set positionally
        run: python3 scripts/metric-desc-lint.py --check

      - name: metric_desc_lint_fires -- the positional detector fires, and does not over-fire
        run: python3 scripts/metric-desc-lint.py --selftest

      # Same reason prose_claims has a companion: a green ban proves nothing unless the scanner can see.
      - name: comment_claims_fires -- the citation detector fires, and does not over-fire
        run: python3 scripts/comment-claims.py --selftest

      # The render gate itself needs a gate. Its oracle verdicts carry a per-oracle tolerance now, and a
      # tolerance nobody has watched fire is not known to fire -- the same reason comment_claims has a
      # companion above. Pure shell against synthetic logs: no GPU, no binary, safe to run anywhere.
      - name: render_gate_verdicts -- every oracle verdict arm fires, and does not over-fire
        run: scripts/render-gate.sh --selftest

      # The profiler's warp cannot be issued until the client is in-world, so a load phase that ends first
      # puts an entire destination-world load INSIDE the measurement window and reports it as render cost.
      # The engine refuses that at the cause now; this is the independent read of the log's own ordering,
      # and it is the arm that still fires against a binary predating the engine fix. Same shape as the two
      # above: pure shell against synthetic logs, no GPU, no binary.
      - name: render_profile_verdicts -- ordered, reversed and absent warps are three distinct verdicts
        run: scripts/render-profile.sh --selftest

      # A GPU timer that brackets a gate it does not enter records a ~0us sample on every skip, so its
      # `count` counts frames rather than draws and its mean is a blend of real work with zeros. Three
      # sites did this; the parallax one reported a 4.04x cost step while the GPU did identical work, and
      # every oracle stayed green throughout -- because a zero is a plausible number (GPUTIMER-1).
      # Static: no GPU, no binary, and it fails at authoring time rather than after a 45-minute run.
      - name: gputimer_brackets -- no GPU timer brackets a gate it does not enter
        run: python3 scripts/gputimer-brackets.py --check

      - name: gputimer_brackets_fires -- the straddle detector fires, and does not over-fire
        run: python3 scripts/gputimer-brackets.py --selftest

      # begin() registers a pass key on its first call, so a pass whose arm never runs has NO key at all --
      # and a consumer differencing two snapshots cannot tell that from a pass that ran and cost nothing.
      # Measured: 27 matrix legs, three different registered key sets out of one binary (R14). Each key is
      # now also registered eagerly at namespace scope, and this asserts the two sets are equal BOTH ways --
      # a registration that outlives its pass reads present-at-zero forever, which is the same lie inverted.
      - name: gpu_pass_keys -- every begun GPU pass key is registered eagerly, and vice versa
        run: python3 scripts/gputimer-brackets.py --check-keys

      - name: gpu_pass_keys_fires -- the bijection detector fires three ways and counts an empty corpus
        run: python3 scripts/gputimer-brackets.py --selftest-keys

      # Engine BUSY is not observable from inside the process, so the PMU series is the only place that
      # quantity exists -- and a series that reads an unopenable counter as 0% is indistinguishable from
      # an idle GPU. Both selftests are synthetic: no GPU, no privilege, no binary.
      - name: pmu_engine_sample_fires -- an unavailable counter is not a zero, and stamps are joinable
        run: python3 scripts/pmu-engine-sample.py --selftest

      # The floor is the whole point. A per-lever GPU table was produced by hand on 2026-08-07 whose
      # deltas were smaller than the baseline's own repeat spread; it was withdrawn by hand, and by hand
      # is not a mechanism. This asserts the floor swallows what it should and passes what it should.
      - name: pmu_join_fires -- deltas inside the resolution floor are refused, not quoted
        run: python3 scripts/pmu-join.py --selftest

      # The SOVEREIGN half of the same job -- per-owner CPU and per-client GPU, which the PMU cannot
      # see. Both selftests are synthetic (a fake /proc, a fake reader, no GPU and no client), which is
      # what makes them registrable here rather than only runnable beside a game.
      #
      # The sampler's rules decide whether a leg was measured AT ALL: two matching processes REFUSE
      # rather than guess (a plausible series about the wrong process is worse than none), an absent
      # target writes an UNAVAILABLE ROW rather than falling silent (silence cannot be told apart from
      # a dead sampler), and respawn is FLOORED -- an instantly-exiting reader was relaunched 500 times
      # in 0.3 seconds before that floor existed, and a sampler burning a core is not the passive
      # observer the whole design rests on.
      - name: metrics_sample_fires -- ambiguity refuses, an absent target is a row, respawn is floored
        run: python3 scripts/metrics-sample.py --selftest

      # The join's rules decide whether the number MEANS anything. Cumulative counters are
      # RE-DIFFERENCED rather than averaged (a rate cannot be re-windowed); the denominator is the span
      # actually COVERED, not the nominal interval, which is otherwise a silent under-report worst at
      # the edges; a pid change or a falling counter is discarded AND reported; one sample is not a
      # measurement; and the attribution residual keeps its SIGN, which is the only evidence available
      # that it is per-thread tick quantisation rather than a leak.
      - name: obs_join_fires -- counters re-differenced, denominator covered, residual signed
        run: python3 scripts/obs-join.py --selftest

      # A telemetry handle registered on a path that is not always taken makes the key ABSENT rather
      # than ZERO, and a consumer differencing two snapshots cannot tell that from "ran and found
      # nothing". NINE instances of that one pattern were found in two days (R07-R11, R13, R14, then
      # R15 and R16 while fixing R14); R13 alone stamped 28 of 28 matrix legs not-quotable. This does
      # not fix them -- it stops the tenth, and it lands BEFORE the descriptor convergence touches all
      # 152 MetricDesc sites, because a large mechanical pass is when the pattern comes back.
      - name: reg_ratchet -- the count of lazily-registered telemetry handles may not grow
        run: python3 scripts/metric-desc-lint.py --check-registrations

      - name: reg_ratchet_fires -- the ratchet fires on growth and refuses to pass on zero matches
        run: python3 scripts/metric-desc-lint.py --selftest-registrations

      # A GL_TIME_ELAPSED span is elapsed TIMELINE, not work. One was declared owner gl's Total and
      # reported the frame PERIOD at 0.22%, 11.39%, 23.39% and 32.93% real engine busy alike, so every
      # "% of the GPU frame" taken from it was a ratio against a constant. The rule keys on the CLOCK
      # rather than the domain: GPU work measured by the PMU or by drm-engine accounting may
      # legitimately be a whole; a timeline never may.
      - name: gpu_timeline_role -- a GpuTimeline span may not be declared Budget or Total
        run: python3 scripts/metric-desc-lint.py --check-timeline

      - name: gpu_timeline_role_fires -- the rule fires on both field orders and spares a work clock
        run: python3 scripts/metric-desc-lint.py --selftest-timeline

      # MetricClock has no default on purpose: an undeclared clock says "nobody has decided yet", which is
      # honest, where a defaulted one would assert something nobody checked. The count of undeclared sites
      # is therefore the honest measure of how much of this model still cannot say work from waiting. It
      # may fall and may not rise -- 165 sites is too many to migrate in one pass, and a large mechanical
      # pass is exactly when the patterns this file guards come back.
      - name: clock_ratchet -- the count of MetricDesc sites declaring no clock may not grow
        run: python3 scripts/metric-desc-lint.py --check-clocks

      - name: clock_ratchet_fires -- the ratchet fires on growth and refuses to pass on an empty corpus
        run: python3 scripts/metric-desc-lint.py --selftest-clocks

      # The render harness lives inside UPSTREAM's client file rather than in a module of its own, and
      # that coupling produced three wrong measurements on 2026-08-06 -- the scene selecting itself from
      # the player save, quiescence firing on the departure world, and a run mutating the inventory it
      # measures. #237 is the fix and it is PARKED, so the quantity it turns on gets a ceiling, the way
      # boundary_ratchet keeps #199 revisitable from data instead of from memory. A parked decision with
      # no instrument gets made by accretion.
      - name: client_residency -- the harness may not grow inside a stock client file
        run: python3 scripts/client-residency.py

      - name: client_residency_fires -- both ceilings fire, and a missing file is not a pass
        run: python3 scripts/client-residency.py --selftest

      # Vendored provenance. Their hand-written extern/README.md contradicted their own vcpkg.json on the
      # day it landed (ledger B12); ours is derived from the tree and fails when it drifts from it.
      - name: extern_provenance -- every vendored artefact is declared and reachable as declared
        run: python3 scripts/extern-provenance.py --check

      - name: extern_provenance_fires -- the drift detector fires, and does not over-fire
        run: python3 scripts/extern-provenance.py --selftest

      # Zones are directories now, so the register is a filesystem layout. Derived, never written.
      - name: tree_map -- the target directory tree matches the register
        run: python3 scripts/tree-map.py --check

      # grant_sweep measures coupling between OUR components, via includes. This runs through SDL's GL
      # sub-API, so no include sweep can see it: 18 references, counted as 1. The needle is a regex
      # because the coupling has three spellings -- SDL_GL_*, SDL_GLContext, SDL_WINDOW_OPENGL -- and
      # the first version of this ratchet saw only the first and reported 15. The host is supposed to
      # own a window, not a GL context.
      # The PR-570 findings ledger is generated from three workflow outputs and a hand-written
      # decisions file. This asserts the two cannot drift, and hard-fails on a decision naming a row
      # that no longer exists -- the gate-vocabulary-outlives-document defect, fifth occurrence.
      # NOTE: the raw outputs live outside the repo, so this CANNOT RUN where they are absent -- which
      # is every CI runner and every fresh clone. That is a SKIP, not a pass, and it must exit 77.
      - name: pr570_ledger -- the findings ledger matches its inputs and its decisions
        run: |
          if [ -d /root/analysis/osb-pr570/raw ]; then
            python3 scripts/pr570-ledger.py --check
          else
            echo "pr570-ledger: DID NOT RUN -- raw outputs not present on this machine. Nothing was"
            echo "pr570-ledger: compared and nothing was verified; this is NOT a pass."
            # 77, not a fall-through. This else-branch ended at the echo and exited 0 until 2026-08-08,
            # so run-gates.sh printed OK and counted a check that compared nothing toward the green
            # tally. dc722dee fixed exactly this for metrics_mutual and said "THE HOLE WAS IN THREE
            # PLACES"; it was in four, and this step was already in the file when that commit landed.
            # The guarded_steps_exit_77 arm of run-gates.sh --selftest now reads this rule mechanically,
            # because a convention I have to remember is how it survived one sweep already.
            exit 77
          fi

      # THE ONE NORTH-STAR CLAIM WITH AN INSTRUMENT BEHIND IT: closure(clientTick) INTERSECT
      # closure(presentTick) is exactly the code both machines must ship once the two sides split.
      #
      # IT WAS DELIBERATELY EXCLUDED FROM THIS FILE UNTIL 2026-08-08, and the reason was sound: it reads
      # compiled objects, so on a script-only runner it would permanently skip, and a permanent skip
      # read like a pass. GATE-SKIP-2 removed that constraint -- a skip is now spelled 77 and
      # run-gates.sh refuses to count it green -- so the exclusion no longer buys anything, and while it
      # stood the ratchet sat RED at 614 against a 596 ceiling for an unknown number of days with no
      # runner able to see it. An instrument nothing runs is indistinguishable from one that agrees.
      #
      # ~6 seconds on a built tree (objdump over ~450 objects, 8 workers).
      - name: dedup_ratchet -- the two sides may not come to share one more file
        run: |
          if compgen -G "build/*/CMakeFiles" > /dev/null || compgen -G "build/*/*/CMakeFiles" > /dev/null; then
            python3 scripts/dedup-measure.py --check
          else
            echo "dedup-measure: DID NOT RUN -- no build tree. This instrument reads compiled objects."
            echo "dedup-measure: Nothing was measured; this is NOT a pass."
            exit 77
          fi

      - name: host_api_neutral -- the SDL host must not know a graphics API
        run: |
          python3 scripts/layering-lint.py --needle "re:SDL_GL|SDL_WINDOW_OPENGL" \
            source/application/StarMainApplication_sdl.cpp=18

      # THE ONE CHECK THAT CAN CONTRADICT A GPU NUMBER. `metrics` reads render-engine busy time out of
      # /proc/<pid>/fdinfo; the i915 PMU reads the same quantity through perf_event_open. Different
      # kernel mechanisms at different scopes -- one client versus the whole device -- so with a single
      # GPU client they must agree. Every defect in this subsystem's history was caught only when an
      # instrument that did NOT share the first one's assumptions disagreed with it: a 4x fdinfo sum, a
      # 4.04x GPU-timer artefact, a cost claim that was really a cold shader cache. None was caught by
      # an oracle; all the oracles were green throughout, because a wrong number is a plausible number.
      #
      # THIS ARM IS THE VERDICT LOGIC, not the comparison. Synthetic ratios: no GPU, no target, no
      # root, so it runs everywhere and is always armed. It drives all eleven arms in both directions,
      # including the exact 4x and 2x mis-scalings the bound exists to catch, because a tolerance
      # nobody has watched fire is not known to fire (#223) -- the same reason render_gate_verdicts
      # exists above.
      - name: metrics_mutual_verdicts -- every verdict arm fires, and does not over-fire
        run: scripts/metrics-mutual-check.sh --selftest

      # AND THIS ARM IS THE LIVE COMPARISON, which needs a GPU client under load and CAP_PERFMON --
      # neither of which a CI runner has. Guarded rather than unconditional because the script exits 2
      # when asked to compare a process that is not there, and it must keep doing that: a cross-check
      # with no subject is a caller error, and turning that into a pass rebuilds the confusion this
      # component exists to end. Guarded, it still fires on the development host whenever a profile run
      # is up, which is the only time it can mean anything.
      #
      # READ THE STEP, NOT THE TALLY. scripts/ci/run-gates.sh prints OK/FAIL and discards a passing
      # step's output, so the not-run line below is invisible in its summary and this step counts
      # toward "N/N green" on every machine where it cannot run.
      # The runner that reports every other gate needs one of its own. It classified on `rc == 0`, so a
      # gate that RAN AND COMPARED NOTHING was indistinguishable from one that verified something --
      # and metrics_mutual was silently exercising exactly that path. Exit 77 is now a third verdict.
      # Safe as a step despite invoking the runner: --selftest returns before gates.yml is parsed.
      - name: run_gates_verdicts -- pass, skip and fail are three distinct verdicts
        run: scripts/ci/run-gates.sh --selftest

      # The gl/gpu closure check now carries a TOLERANCE, derived from a 10-run null control (#236),
      # because at zero tolerance it fired on 8 of 19 real captures of an UNCHANGED system. A bound
      # introduced to stop false alarms carries the opposite risk -- silence mistaken for correctness --
      # so it is watched from both ends: the measured spread must stay quiet, a breach must fire, and
      # the blind spot (a duplicated part smaller than the bound) is ASSERTED rather than admitted in a
      # comment, so tightening the bound flips an arm instead of silently changing what is covered.
      # This is #223's lesson: a bounded-diff oracle read as a zero-diff one reported green for weeks.
      - name: closure_tolerance -- the gl/gpu bound fires, does not over-fire, and its blind spot holds
        run: python3 scripts/telemetry-window.py --selftest

      # The lever-matrix prerequisite ledger: 49 findings from a five-agent read-only sweep, each one
      # something that would make a matrix number wrong. --check asserts each row's status against the
      # TREE -- an open row's defect must still be present, a done row's must be gone -- and prints how
      # many rows carry no signature and are therefore asserted rather than verified.
      #
      # That last number is the point. scripts/pr570-ledger.py checks its table against its decisions
      # file and vice versa: two views of one claim agreeing with each other, which let ten rows sit
      # "accepted" while the change was already shipped. Internal consistency is not correspondence.
      - name: matrix_prereq_ledger -- every row's status corresponds to the tree
        run: python3 scripts/matrix-prereq-ledger.py --check

      - name: matrix_prereq_ledger_verdicts -- the checker fires in both directions
        run: python3 scripts/matrix-prereq-ledger.py --selftest

      # THE MATRIX ITSELF IS NOT A GATE -- it needs a GPU and hours. But two things about it are
      # checkable in milliseconds anywhere, and both are the kind that rot silently.
      #
      # The selftest drives all eleven arms in BOTH directions, including the 2026-08-04 shape: two
      # legs whose witness metric is identical, which the runner must call VOID rather than quote a
      # delta from. That defect produced a full table of plausible numbers and nothing objected; an
      # arm nobody has watched fire is not known to fire (#223).
      - name: lever_matrix_verdicts -- ok, void and refused are distinct verdicts
        run: scripts/lever-matrix.sh --selftest

      # And this one checks the declared lever table against the TREE, not against itself. Someone
      # re-pins a key in harness/storage-perf/starbound.config, the table keeps declaring the old
      # value, and every later matrix run measures a baseline nobody declared -- internal consistency
      # is not correspondence. Exits 77 while the table is still empty, which is an ABSENT verdict:
      # run-gates.sh will say so rather than count it green.
      - name: lever_table -- the declared levers still match the harness config
        run: scripts/lever-matrix.sh --check-table

      - name: metrics_mutual -- the two kernel readers agree, or say why they could not compare
        run: |
          if pgrep -x starbound >/dev/null; then
            scripts/metrics-mutual-check.sh
          else
            echo "metrics_mutual: NOT RUN -- no GPU client on this machine. Nothing was compared."
            # 77, not a fall-through. This else-branch used to end here and exit 0, so run-gates.sh
            # printed OK and counted a comparison that never happened toward the green tally. The
            # guard was the hole, one level above the runner's own.
            exit 77
          fi
