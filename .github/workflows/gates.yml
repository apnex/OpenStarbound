# THE ARCHITECTURE GATES, ON EVERY PUSH, WITH NO PATHS FILTER.
#
# build.yml -- which is where these gates otherwise run, as ctest tests -- triggers only on changes under
# assets/, source/, toolchains/ or triplets/. That filter is right for a six-job multi-platform compile and
# exactly wrong for every check below, because their INPUTS live in the two trees the filter excludes:
#
#   render_docs_fresh  reads docs/render/architecture-3-target-state.md    -> docs/**
#   boundary_fresh     reads docs/render/game-render-boundary.md           -> docs/**
#   arch_graph_fresh   reads docs/architecture/system-boundaries.md        -> docs/**
#   layer1_layering    is  scripts/layering-lint.py                        -> scripts/**
#   render_layering    is  the same script, different needle               -> scripts/**
#   config_declared    is  scripts/config-lint.py                          -> scripts/**
#   boundary_ratchet   is  scripts/boundary-inventory.py                   -> scripts/**
#
# So the gates were blind to commits in precisely the trees they police: a doc-only commit could not fail
# the doc-drift gate, and editing an instrument could not fail the instrument. 8781759c -- the docs/render
# index -- started no CI job at all. This workflow closes that, and it is deliberately cheap: no compiler,
# no vcpkg, no cache, a few seconds. Widening build.yml's filter instead would have fired six full
# multi-platform builds for a typo fix.
#
# NOT COVERED HERE, AND NOT A GAP: the configure-time checks in source/test/CMakeLists.txt (the NoAssets
# label rule and the CMakePresets filter assertion) are triggered by their own files, which are under
# source/ and therefore already match build.yml's filter.
name: Gates

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  gates:
    name: Architecture gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # These are the same commands source/test/CMakeLists.txt registers with ctest, run directly. Naming
      # the interpreter rather than relying on the shebang is the rule that #192 cost a red CI to learn.
      - name: layer1_layering -- the sovereign L1 module must not name OpenGlRenderer
        run: python3 scripts/layering-lint.py

      # --from-cmake, NOT a pasted copy of the ceilings. The ratchet is declared once, in the ctest
      # registration; restating the numbers here would let a lowered ceiling in CMakeLists leave a stale
      # copy quietly passing -- the one-knob-two-declarations defect #185 exists to delete.
      - name: render_layering -- the L3 Air-Gap ratchet
        run: python3 scripts/layering-lint.py --needle "Root::singleton" --from-cmake

      - name: render_docs_fresh -- generated coupling counts still match the tree
        run: python3 scripts/render-inventory.py --check docs/render/architecture-3-target-state.md

      - name: config_declared -- every getOrDefault key has a declared default
        run: python3 scripts/config-lint.py

      # The ceiling is passed here rather than restated: it lives in source/test/CMakeLists.txt, and a pasted
      # copy would let a lowered ceiling leave a stale duplicate quietly passing.
      - name: boundary_ratchet -- the game layer's push-sink surface may not grow
        run: |
          CEIL=$(grep -oE 'boundary-inventory\.py --max-sink [0-9]+' source/test/CMakeLists.txt \
                 | grep -oE '[0-9]+$')
          test -n "$CEIL" || { echo "could not read the boundary ceiling from source/test/CMakeLists.txt"; exit 1; }
          python3 scripts/boundary-inventory.py --max-sink "$CEIL"

      - name: boundary_fresh -- the boundary doc's generated numbers match the tree
        run: python3 scripts/boundary-inventory.py --check docs/render/game-render-boundary.md

      # Nine generated Mermaid diagrams, one altitude up from the render docs. Also fails on duplicate
      # header basenames and on a tier table that contradicts the grants -- the two conditions under
      # which the generator would draw something confidently wrong.
      - name: arch_graph_fresh -- the system-boundary diagrams match the tree
        run: python3 scripts/arch-graph.py --check docs/architecture/system-boundaries.md

      # The grant table is the one artifact in the headless-client design with no instrument behind
      # it, and two defects sat there -- both would have failed to compile. Transitive, because the
      # preprocessor is; plus a ratchet on the crossings the design exists to delete.
      - name: grant_sweep -- the headless-client grant table matches the tree
        run: python3 scripts/grant-sweep.py --check

      # The design's loop count was wrong twice, both found by inspection. A count nobody can
      # recompute is a claim, not a measurement.
      - name: loop_inventory -- every cadence loop is declared and the spec agrees
        run: python3 scripts/loop-inventory.py --check

      # N1.d called itself "countable" and "gateable rather than aspirational" while Section 18
      # recorded that the ratchet had no metric and no ceiling -- two writers disagreeing about
      # whether the document's own rule was enforceable. The definition was already in the seam
      # table: a round trip is a call that RETURNS. Ceiling 1, plus the assertion a total count
      # cannot make on its own -- that no Sink answers.
      - name: round_trip_ceiling -- seam 1 declares at most one call that returns
        run: python3 scripts/round-trip.py --check
      - name: round_trip_fires -- both round-trip assertions fire on a known defect
        run: python3 scripts/round-trip.py --selftest

      # "Is every table generated from a source?" was answered three times from the command line and
      # was wrong three times. This counts tables two independent ways, requires the two to agree,
      # and reconciles the derivation tables against the register -- so the answer is reproducible
      # rather than mine. A MEASUREMENT: there is no ceiling on unread tables.
      - name: table_census -- every table counted two ways, derivations reconciled to the register
        run: python3 scripts/table-census.py --check

      # The design is described twice on purpose -- Section 4 compile, Section 5 run time -- and two
      # descriptions of one model drift. The graft rule is the reason this is a gate: every runtime
      # edge must be legal in the compile projection, and its first run found the host unable to
      # trigger the paint.
      - name: spec_consistency -- both projections agree, and the graft holds
        run: python3 scripts/spec-consistency.py --check

      # Derived from the grant table, so it needs no build and belongs here rather than only in ctest.
      - name: composition_graphs -- per-composition diagrams match the grant table
        run: python3 scripts/composition-graphs.py --check

      # Derived from the runtime projection's edges. Fails on an element that is neither driven nor
      # declared undriven -- "what starts this?" must have an answer for all 24.
      - name: drive_table -- what drives what, generated from the runtime projection
        run: python3 scripts/drive-table.py --check

      # The only gate that greps C++ for the design. Owns the tree measurements a DESIGN DECISION
      # rests on -- "thirteen render() bodies" was 17, "exactly four" Lua groups was 11.
      - name: spec_measures -- the load-bearing measurements still hold
        run: python3 scripts/spec-measures.py --check

      # Counts whether each component is DERIVED, facet by facet. Every other gate here checks that a
      # declaration is well-formed; this one checks that the declaration was ever REASONED FOR. A
      # warranted register row looks finished, which is exactly why 32 of 41 components could carry a
      # duty, a warrant and nothing else without one gate noticing.
      - name: spec_derivations -- every component reasoned for, not merely declared
        run: python3 scripts/spec-derivations.py --check

      # The only gate that reads the WORDS. The others check tables and were all green while the
      # prose said "three clocks", called `participant` `client`, and referenced undefined decisions.
      - name: prose_claims -- the prose agrees with the registers
        run: python3 scripts/prose-claims.py --check

      # A green gate says the document is clean; it says nothing about whether the gate can see. Two
      # of prose_claims' verdicts were half-blind for their entire life while reporting OK. This
      # injects one known defect per verdict and asserts each fires, plus a control that must not.
      - name: prose_claims_fires -- every verdict fires on a known defect
        run: python3 scripts/prose-claims.py --selftest

      # The gate suite is otherwise blind to comments by design -- layering-lint strips them before it
      # reads anything. This is the one comment claim a machine can settle: a file:line citation. All
      # nine that existed were ours, 55% had already rotted, and two written on one day were both wrong
      # within ten days. So the FORM goes, not the instances (#218).
      - name: comment_claims -- no source comment cites a file by line number
        run: python3 scripts/comment-claims.py

      # Same reason prose_claims has a companion: a green ban proves nothing unless the scanner can see.
      - name: comment_claims_fires -- the citation detector fires, and does not over-fire
        run: python3 scripts/comment-claims.py --selftest

      # The render gate itself needs a gate. Its oracle verdicts carry a per-oracle tolerance now, and a
      # tolerance nobody has watched fire is not known to fire -- the same reason comment_claims has a
      # companion above. Pure shell against synthetic logs: no GPU, no binary, safe to run anywhere.
      - name: render_gate_verdicts -- every oracle verdict arm fires, and does not over-fire
        run: scripts/render-gate.sh --selftest

      # A GPU timer that brackets a gate it does not enter records a ~0us sample on every skip, so its
      # `count` counts frames rather than draws and its mean is a blend of real work with zeros. Three
      # sites did this; the parallax one reported a 4.04x cost step while the GPU did identical work, and
      # every oracle stayed green throughout -- because a zero is a plausible number (GPUTIMER-1).
      # Static: no GPU, no binary, and it fails at authoring time rather than after a 45-minute run.
      - name: gputimer_brackets -- no GPU timer brackets a gate it does not enter
        run: python3 scripts/gputimer-brackets.py --check

      - name: gputimer_brackets_fires -- the straddle detector fires, and does not over-fire
        run: python3 scripts/gputimer-brackets.py --selftest

      # Vendored provenance. Their hand-written extern/README.md contradicted their own vcpkg.json on the
      # day it landed (ledger B12); ours is derived from the tree and fails when it drifts from it.
      - name: extern_provenance -- every vendored artefact is declared and reachable as declared
        run: python3 scripts/extern-provenance.py --check

      - name: extern_provenance_fires -- the drift detector fires, and does not over-fire
        run: python3 scripts/extern-provenance.py --selftest

      # Zones are directories now, so the register is a filesystem layout. Derived, never written.
      - name: tree_map -- the target directory tree matches the register
        run: python3 scripts/tree-map.py --check

      # grant_sweep measures coupling between OUR components, via includes. This runs through SDL's GL
      # sub-API, so no include sweep can see it: 18 references, counted as 1. The needle is a regex
      # because the coupling has three spellings -- SDL_GL_*, SDL_GLContext, SDL_WINDOW_OPENGL -- and
      # the first version of this ratchet saw only the first and reported 15. The host is supposed to
      # own a window, not a GL context.
      # The PR-570 findings ledger is generated from three workflow outputs and a hand-written
      # decisions file. This asserts the two cannot drift, and hard-fails on a decision naming a row
      # that no longer exists -- the gate-vocabulary-outlives-document defect, fifth occurrence.
      # NOTE: the raw outputs live outside the repo, so this is a no-op where they are absent.
      - name: pr570_ledger -- the findings ledger matches its inputs and its decisions
        run: |
          if [ -d /root/analysis/osb-pr570/raw ]; then
            python3 scripts/pr570-ledger.py --check
          else
            echo "pr570-ledger: SKIPPED -- raw outputs not present on this machine"
          fi

      - name: host_api_neutral -- the SDL host must not know a graphics API
        run: |
          python3 scripts/layering-lint.py --needle "re:SDL_GL|SDL_WINDOW_OPENGL" \
            source/application/StarMainApplication_sdl.cpp=18
